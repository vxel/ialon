apply plugin: "java"
apply plugin: "jacoco"
sourceSets.main.java.srcDirs = ["src/main/java"]

ext {
    minieVersion = '7.4.0'
    lombokVersion = '1.18.46'
    simMathVersion = '1.6.0'
    sio2Version = '1.7.0'
    blocksVersion = "1.6.4"
    protobufVersion = '4.35.0'
    jacksonVersion = '2.22.0'
    lemurprotoVersion = "1.13.0"
    logbackVersion = '1.5.34'
    mockitoVersion = '5.23.0'
    junitVersion = '6.1.0'
}

dependencies {

    // physics
    implementation "com.github.stephengold:Minie:${minieVersion}"

    // utilities
    //noinspection AnnotationProcessorOnCompilePath
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    implementation "com.google.protobuf:protobuf-java:${protobufVersion}"
    implementation "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:${jacksonVersion}"
    implementation "com.simsilica:sim-math:${simMathVersion}"
    implementation "com.simsilica:lemur-proto:${lemurprotoVersion}"

    // logging
    implementation "ch.qos.logback:logback-core:${logbackVersion}"
    implementation "ch.qos.logback:logback-classic:${logbackVersion}"
    implementation 'org.slf4j:jul-to-slf4j:2.0.18'

    testImplementation "org.mockito:mockito-core:${mockitoVersion}"
    testImplementation "org.junit.jupiter:junit-jupiter-api:${junitVersion}"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${junitVersion}"
    // Gradle 9 no longer puts the JUnit Platform launcher on the test runtime classpath automatically.
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:${junitVersion}"
}

test {
    useJUnitPlatform()
}

// Renders a single off-screen screenshot of the world via the support ScreenshotHarness and writes a
// PNG, then exits. Needs a display (real or Xvfb) and a GL driver (Mesa software GL is fine). Example :
//   ./gradlew :core:screenshot                       # default island vantage -> core/build/screenshots/
//   ./gradlew :core:screenshot --args="out.png"      # custom output path
//   ./gradlew :core:screenshot -Dialon.noClipmap=true --args="out.png seam"   # A/B a debug toggle
tasks.register('screenshot', JavaExec) {
    group = 'verification'
    description = 'Render an off-screen screenshot of the world (support.ScreenshotHarness).'
    mainClass = 'org.delaunois.ialon.support.ScreenshotHarness'
    classpath = sourceSets.test.runtimeClasspath
    // Run from the repo root so 'core/build/...' output paths (and asset-relative lookups, matching the
    // other support harnesses) resolve the same way whether invoked as :core:screenshot or from root.
    workingDir = rootProject.projectDir
    // Forward the game's own -Dialon.* debug toggles (noClipmap, noRelief, noWater, noEnclosure, ...) to
    // the forked JVM : without this they stay on the Gradle daemon and the A/B silently renders the same
    // frame twice. Never cached, so a toggle change always re-renders.
    outputs.upToDateWhen { false }
    doFirst {
        System.properties.each { k, v ->
            if (k.toString().startsWith('ialon.')) {
                systemProperty(k.toString(), v)
            }
        }
    }
}

// Bakes a TTF into the BMFont pair the game consumes (.fnt + single .png page) via the support
// BitmapFontGenerator. Authoring-time only, headless, no external tool. Examples :
//   ./gradlew :core:generateFont                                   # Jura Bold 44px -> Textures/font-jura.*
//   ./gradlew :core:generateFont --args='--size=56 --gamma=1.2'    # tweak
//   ./gradlew :core:generateFont --args='--shadow=3'               # deeper drop shadow (0 = flat page)
tasks.register('generateFont', JavaExec) {
    group = 'build'
    description = 'Bake a TTF into a BMFont .fnt + .png page (support.BitmapFontGenerator).'
    mainClass = 'org.delaunois.ialon.support.BitmapFontGenerator'
    classpath = sourceSets.test.runtimeClasspath
    // Same rationale as 'screenshot' : keep the --ttf / --out paths relative to the repo root.
    workingDir = rootProject.projectDir
}

// Renders the UI font onto the screen (real Lemur styling, atlas-remapped font) and writes a PNG, then
// exits. Same display/GL requirements as 'screenshot'. Example :
//   ./gradlew :core:fontPreview                            # -> core/build/screenshots/font-preview.png
//   ./gradlew :core:fontPreview --args="out.png"
tasks.register('fontPreview', JavaExec) {
    group = 'verification'
    description = 'Screenshot the UI font as the game styles it (support.FontPreview).'
    mainClass = 'org.delaunois.ialon.support.FontPreview'
    classpath = sourceSets.test.runtimeClasspath
    workingDir = rootProject.projectDir
}

// Screenshots the steampunk UI chrome (IalonTheme) at two resolutions, so the nine-patch frames can be
// checked for constant relative thickness and for smearing. Same display/GL requirements as 'screenshot'.
//   ./gradlew :core:uiPreview                               # -> core/build/screenshots/ui-preview-*.png
//   ./gradlew :core:uiPreview --args="out.png 2400 1080"    # one specific size
//   ./gradlew :core:uiPreview -Pframes=400                  # capture later : the backdrop is animated
tasks.register('uiPreview', JavaExec) {
    group = 'verification'
    description = 'Screenshot the steampunk UI chrome as the game styles it (support.UiPreview).'
    mainClass = 'org.delaunois.ialon.support.UiPreview'
    classpath = sourceSets.test.runtimeClasspath
    workingDir = rootProject.projectDir
    // The popup backdrop is the animated steam (ui.SteamBackground), and one still at a fixed instant
    // says nothing about how it evolves : -Pframes renders further before capturing.
    systemProperty 'ialon.uiPreview.frames', findProperty('frames') ?: '10'
}

// Screenshots the in-game HUD (the play-screen controls) by booting the real game and capturing the GUI
// viewport. The only harness that shows the on-screen buttons ; same display/GL requirements as
// 'screenshot'. Examples :
//   ./gradlew :core:hudPreview                       # -> core/build/screenshots/hud-preview.png
//   ./gradlew :core:hudPreview -PsettleMs=35000      # slower machine : wait longer before capturing
tasks.register('hudPreview', JavaExec) {
    group = 'verification'
    description = 'Screenshot the in-game HUD from the real application (support.HudPreview).'
    mainClass = 'org.delaunois.ialon.support.HudPreview'
    classpath = sourceSets.test.runtimeClasspath
    workingDir = rootProject.projectDir
    systemProperty 'ialon.hudPreview.settleMs', findProperty('settleMs') ?: '25000'
    // 'regionDelete' opens the bulk-delete selection before capturing, which is the HUD variant that hides
    // the +/- buttons and offers "Reset chunk" in the "-" slot. 'chunkReset' goes on to the confirmation
    // dialog, and 'chunkResetRun' confirms it -- which EDITS THE SAVED WORLD, so back up ./save first.
    // 'position' forces the top-left position / in-game clock readout on, whatever the saved settings say.
    systemProperty 'ialon.hudPreview.mode', findProperty('hudMode') ?: ''
    // World to boot against ; use a copy for the destructive mode above.
    systemProperty 'ialon.hudPreview.savePath', findProperty('savePath') ?: ''
}

// Films the creation viewer popup : boots the real game, opens the creation library, clicks "Preview" on
// the first creation of ./save and captures the GUI viewport repeatedly while the model turns. The only
// harness that shows the offscreen creation render on screen, hence the only place its orientation, its
// brightness and its framing can be checked without a device. Same display/GL requirements as 'screenshot'.
//   ./gradlew :core:creationViewerPreview                     # -> core/build/screenshots/creation-viewer-NNN.png
//   ./gradlew :core:creationViewerPreview -Pshots=12           # a longer filmstrip
//   ./gradlew :core:creationViewerPreview -Pwidth=800 -Pheight=600   # a small screen
//   ./gradlew :core:creationViewerPreview -Pinteractive=true   # leave the window up and drag the model
tasks.register('creationViewerPreview', JavaExec) {
    group = 'verification'
    description = 'Film the creation 3D viewer popup (support.CreationViewerPreview).'
    mainClass = 'org.delaunois.ialon.support.CreationViewerPreview'
    classpath = sourceSets.test.runtimeClasspath
    workingDir = rootProject.projectDir
    systemProperty 'ialon.creationViewerPreview.settleMs', findProperty('settleMs') ?: '25000'
    systemProperty 'ialon.creationViewerPreview.shotMs', findProperty('shotMs') ?: '500'
    systemProperty 'ialon.creationViewerPreview.shots', findProperty('shots') ?: '8'
    // Worth running small as well as large : the library's button column is one row taller with "Preview".
    systemProperty 'ialon.creationViewerPreview.width', findProperty('width') ?: '1280'
    systemProperty 'ialon.creationViewerPreview.height', findProperty('height') ?: '720'
    // Rebuilds the framebuffer and its texture while the popup is up, which is where a leak or a deleted
    // target still being drawn into would show.
    systemProperty 'ialon.creationViewerPreview.resize', findProperty('resize') ?: ''
    // Which creation to open (its id, i.e. the .zcreation file name) ; the first one by default.
    systemProperty 'ialon.creationViewerPreview.creation', findProperty('creation') ?: ''
    // Closes and reopens the viewer that many times (forcing a GC each time) before filming : a teardown
    // that frees a GL object the wrong way only shows from the second viewing on.
    systemProperty 'ialon.creationViewerPreview.reopens', findProperty('reopens') ?: '0'
    // Second creation to alternate with while reopening : the render target is reused across viewings, so
    // switching creations is what proves the camera is re-aimed at the new bounding box.
    systemProperty 'ialon.creationViewerPreview.alternate', findProperty('alt') ?: ''
    // Presses "Set image" before going back : REWRITES the creation's card PNG in ./save, so point the world
    // at a copy if that matters.
    systemProperty 'ialon.creationViewerPreview.setImage', findProperty('setImage') ?: ''
    // Hands the window over instead of capturing : the drag gesture is the one thing a still cannot show.
    systemProperty 'ialon.creationViewerPreview.interactive', findProperty('interactive') ?: ''
}

// Films the loading screen : boots the real game and captures the GUI viewport repeatedly while the
// world loads, so the progress bar and the phase labels can be checked as a filmstrip rather than as a
// single still. Same display/GL requirements as 'screenshot'. Examples :
//   ./gradlew :core:splashPreview                    # -> core/build/screenshots/splash-NNN.png
//   ./gradlew :core:splashPreview -PshotMs=250       # capture more often
//   ./gradlew :core:splashPreview -Pshots=30         # capture more frames (slower machine)
tasks.register('splashPreview', JavaExec) {
    group = 'verification'
    description = 'Film the loading screen from the real application (support.SplashPreview).'
    mainClass = 'org.delaunois.ialon.support.SplashPreview'
    classpath = sourceSets.test.runtimeClasspath
    workingDir = rootProject.projectDir
    systemProperty 'ialon.splashPreview.shotMs', findProperty('shotMs') ?: '400'
    systemProperty 'ialon.splashPreview.shots', findProperty('shots') ?: '20'
}

// Plays the wildlife ambience through real OpenAL, with the real 3D placement, without loading a world
// -- the step local/tools/preview-ambience.sh cannot do (it mixes offline and fakes the spatialisation).
// Needs a sound device and a display. Examples :
//   ./gradlew :core:ambiencePreview                      # 60 s : day, dusk crossfade, night
//   ./gradlew :core:ambiencePreview --args="--night"     # owls only
//   ./gradlew :core:ambiencePreview --args="--water 40" # the submerged water bed, in and out
//   ./gradlew :core:ambiencePreview --args="--dive 40"  # birds cut mid-call by a dive, and back
// Two isolating modes, for telling OUR audio apart from the machine's. Both play one sound and then
// touch nothing at all — no fade, no listener movement, no scheduler — so anything still wrong is
// below us. --tone needs a file : -Dialon.tone=/path/to/x.wav
//   ./gradlew :core:ambiencePreview --args="--bedonly 18"
//   ./gradlew :core:ambiencePreview --args="--tone 18" -Dialon.tone=/tmp/tone.wav
//   ./gradlew :core:ambiencePreview --args="--day 30"    # birds only, 30 s
tasks.register('ambiencePreview', JavaExec) {
    group = 'verification'
    description = 'Play the ambient wildlife through OpenAL, positioned (support.AmbiencePreview).'
    mainClass = 'org.delaunois.ialon.support.AmbiencePreview'
    classpath = sourceSets.test.runtimeClasspath
    workingDir = rootProject.projectDir
}

jacocoTestReport {
    reports {
        xml.required = true
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// Keep authoring/source art (GIMP, Inkscape, Blender, model sources, backups) in version
// control next to their runtime outputs, but exclude it from the packaged jar/APK -- none of
// these are loaded at runtime (jME uses the .png / .j3o forms). Trims ~2.4 MB off the build,
// which matters for the Android target.
processResources {
    exclude '**/*.xcf'      // GIMP sources -> .png
    exclude '**/*.svg'      // Inkscape sources -> .png
    exclude '**/*.blend'    // Blender sources -> .j3o
    exclude '**/*.blend1'   // Blender auto-backups
    exclude '**/*.obj'      // model sources -> .j3o
    exclude '**/*.mtl'      // model sources -> .j3o
    exclude '**/*.bak'      // backups
}


